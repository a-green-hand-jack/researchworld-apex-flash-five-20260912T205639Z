<!doctype html>
<html lang="en" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ResearchWorld Observatory</title>
<style>
:root{
  --bg:#f7f7f5; --panel:#ffffff; --ink:#1a1a19; --muted:#6b6b66; --line:#e2e2dd;
  --accent:#3b6ea5; --ok:#2f7d54; --warn:#a8760f; --bad:#a33a2f; --idle:#9a9a94;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
:root[data-theme="dark"],
:root[data-theme="auto"]{color-scheme:light dark}
@media (prefers-color-scheme:dark){
  :root[data-theme="auto"]{
    --bg:#16171a; --panel:#1e2024; --ink:#e8e8e4; --muted:#9a9a94; --line:#2e3137;
    --accent:#6fa8dc; --ok:#5cb87f; --warn:#d6a13c; --bad:#e0736a; --idle:#5c5f66;
  }
}
:root[data-theme="dark"]{
  --bg:#16171a; --panel:#1e2024; --ink:#e8e8e4; --muted:#9a9a94; --line:#2e3137;
  --accent:#6fa8dc; --ok:#5cb87f; --warn:#d6a13c; --bad:#e0736a; --idle:#5c5f66;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:14px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{display:flex;gap:12px;align-items:center;flex-wrap:wrap;
  padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel);
  position:sticky;top:0;z-index:5}
h1{font-size:15px;margin:0;font-weight:600;letter-spacing:.01em}
.sp{flex:1}
button,select{font:inherit;color:var(--ink);background:var(--panel);
  border:1px solid var(--line);border-radius:6px;padding:4px 10px;cursor:pointer}
button:hover{border-color:var(--accent)}
button[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
.fresh{font:12px var(--mono);color:var(--muted)}
main{padding:16px;display:grid;gap:16px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;
  padding:12px 14px;cursor:pointer}
.card:hover{border-color:var(--accent)}
.card h3{margin:0 0 4px;font:600 13px var(--mono)}
.card p{margin:0 0 8px;color:var(--muted);font-size:12px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pill{display:inline-block;padding:1px 8px;border-radius:99px;font:11px var(--mono);
  border:1px solid var(--line)}
.pill.running{background:var(--accent);color:#fff;border-color:var(--accent)}
.pill.ok{color:var(--ok);border-color:var(--ok)}
.pill.bad{color:var(--bad);border-color:var(--bad)}
.pill.warn{color:var(--warn);border-color:var(--warn)}
.bar{height:5px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:8px}
.bar span{display:block;height:100%;background:var(--accent)}
.split{display:grid;grid-template-columns:minmax(420px,1fr) minmax(340px,420px);gap:16px}
@media (max-width:1000px){.split{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px}
.panel h2{margin:0 0 8px;font-size:12px;text-transform:uppercase;
  letter-spacing:.08em;color:var(--muted);font-weight:600}
svg{width:100%;height:auto;display:block}
.node circle{transition:fill .3s}
.node text{font:600 11px var(--mono);fill:var(--ink);text-anchor:middle;pointer-events:none;
  paint-order:stroke;stroke:var(--panel);stroke-width:4px;stroke-linejoin:round}
.node .sub{font:9px var(--mono);fill:var(--muted);font-weight:400;stroke-width:3px}
.node{cursor:pointer}
.node.sel circle.main{stroke:var(--accent);stroke-width:3}
.edge{fill:none;stroke:var(--muted)}
.edge.live{stroke:var(--accent);stroke-dasharray:5 4;animation:flow 1.1s linear infinite}
.edge.none{stroke-dasharray:2 5;opacity:.28}
@keyframes flow{to{stroke-dashoffset:-18}}
@media (prefers-reduced-motion:reduce){.edge.live{animation:none}.pulse{animation:none}}
.pulse{animation:breathe 1.8s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.25;r:24}50%{opacity:0;r:34}}
.elabel{font:9px var(--mono);fill:var(--muted);text-anchor:middle;pointer-events:none;
  paint-order:stroke;stroke:var(--panel);stroke-width:4px;stroke-linejoin:round}
.tabs{display:flex;gap:4px;margin-bottom:10px;flex-wrap:wrap}
.tabs button{padding:3px 10px;font-size:12px}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;color:var(--muted);font-weight:600;padding:4px 6px;
  border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel)}
td{padding:4px 6px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
.scroll{max-height:420px;overflow:auto}
code,.mono{font-family:var(--mono);font-size:11px}
.chips{display:flex;gap:3px}
.chip{width:9px;height:9px;border-radius:2px;border:1px solid var(--muted)}
.chip.on{background:var(--ok);border-color:var(--ok)}
.empty{color:var(--muted);padding:18px;text-align:center}
.err{color:var(--bad);font-size:12px;margin-top:6px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px}
.hit{stroke:transparent;stroke-width:14;fill:none;cursor:pointer}
.drill{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px}
.drill header{position:static;border:0;background:none;padding:0 0 8px}
.drill h2{margin:0;font-size:13px;font-weight:600;text-transform:none;letter-spacing:0;color:var(--ink)}
.crumb{font:11px var(--mono);color:var(--muted)}
.pane{display:grid;grid-template-columns:minmax(180px,260px) 1fr;gap:12px}
@media (max-width:820px){.pane{grid-template-columns:1fr}}
.list{max-height:460px;overflow:auto;border:1px solid var(--line);border-radius:8px}
.list button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);
  border-radius:0;padding:6px 8px;font:11px var(--mono);background:none}
.list button:hover{background:var(--bg)}
.list button[aria-pressed="true"]{background:var(--accent);color:#fff}
pre{margin:0;white-space:pre-wrap;word-break:break-word;font:11px/1.5 var(--mono);
  background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;
  max-height:460px;overflow:auto}
pre.diff span.add{color:var(--ok)}
pre.diff span.del{color:var(--bad)}
pre.diff span.hunk{color:var(--accent)}
.step{border:1px solid var(--line);border-radius:8px;padding:8px;margin-bottom:8px}
.step > summary{cursor:pointer;font:11px var(--mono);color:var(--muted)}
.step[open] > summary{margin-bottom:6px}
.tool{font:11px var(--mono);color:var(--accent)}
.msg{border-bottom:1px solid var(--line);padding:8px 0}
.msg:last-child{border-bottom:0}
.msg h4{margin:0 0 2px;font:600 12px system-ui}
.warnbar{color:var(--warn);font-size:12px;margin:6px 0}
.feedstatus{font-size:11px}
.feedstatus.live{color:var(--ok)}
.feedstatus.stale{color:var(--warn)}
.feedstatus.error{color:var(--bad)}
.world-input{padding:0;overflow:hidden;margin-bottom:16px}
.input-head{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap;padding:12px 14px;
  border-bottom:1px solid var(--line)}
.input-head h2{margin:0;font-size:13px;text-transform:none;letter-spacing:0;color:var(--ink)}
.input-grid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(300px,.8fr);gap:0}
@media (max-width:900px){.input-grid{grid-template-columns:1fr}}
.input-block{padding:12px 14px;min-width:0;border-right:1px solid var(--line)}
.input-block:nth-child(2){border-right:0}
.input-block.wide{grid-column:1/-1;border-right:0;border-top:1px solid var(--line)}
.input-block h3,.input-block h4{margin:0 0 8px;font-size:12px}
.input-block h4{margin-top:12px;color:var(--muted)}
.input-title{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.input-title .sp{min-width:8px}
.input-topic{max-height:220px;background:transparent}
.fact-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px}
.fact{border:1px solid var(--line);border-radius:7px;padding:7px 8px;min-width:0}
.fact span{display:block;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.05em}
.fact code{display:block;margin-top:2px;font-size:11px;overflow-wrap:anywhere}
.input-note{margin:8px 0 0;color:var(--muted);font-size:11px}
.override-wrap{overflow:auto;border:1px solid var(--line);border-radius:8px}
.worker-lines{display:grid;gap:2px;min-width:190px}
.worker-lines span{color:var(--muted)}
details.input-config{margin-top:10px;border:1px solid var(--line);border-radius:8px;padding:8px}
details.input-config > summary{cursor:pointer;font:11px var(--mono);color:var(--accent)}
details.input-config[open] > summary{margin-bottom:8px}
</style>
</head>
<body>
<header>
  <h1>ResearchWorld</h1>
  <select id="worlds"><option value="">— pick a world —</option></select>
  <span class="fresh" id="fresh"></span>
  <span class="feedstatus" id="feedstatus" role="status" aria-live="polite"></span>
  <span class="sp"></span>
  <button id="pause" aria-pressed="false">pause</button>
  <button id="full">refresh repos</button>
  <button id="theme">theme</button>
</header>
<main>
  <section id="home"><div class="cards" id="cards"></div></section>
  <section id="detail" hidden>
    <section id="worldinput" class="panel world-input"></section>
    <div class="split">
      <div class="panel">
        <h2>Repo graph</h2>
        <svg id="graph" viewBox="0 0 1080 580" role="img" aria-label="research organization graph"></svg>
        <div class="legend">
          <span><i style="background:var(--accent)"></i>running</span>
          <span><i style="background:var(--ok)"></i>worked</span>
          <span><i style="background:var(--bad)"></i>last failed</span>
          <span><i style="background:var(--idle)"></i>never ran</span>
          <span>edge width = traffic · dashed = unused</span>
        </div>
      </div>
      <div class="panel">
        <div class="tabs" id="tabs"></div>
        <div id="tabbody" class="scroll"></div>
      </div>
    </div>
    <div class="drill" id="drill" hidden style="margin-top:16px">
      <header>
        <div class="crumb" id="drillcrumb"></div>
        <div style="display:flex;align-items:center;gap:10px">
          <button id="drillback" hidden>← back</button>
          <h2 id="drilltitle"></h2>
          <span class="sp"></span>
          <button id="drillclose">close</button>
        </div>
      </header>
      <div class="tabs" id="drilltabs"></div>
      <div id="drillbody"></div>
    </div>
  </section>
</main>
<script>window.RW_STATIC = {"worlds": ["rw_3358cd984970", "rw_513dfb858845", "rw_e6e6f7673af3", "rw_943684eed859", "rw_e147d495f03d"], "published_at": 1789277528.8898718, "data": "https://raw.githubusercontent.com/a-green-hand-jack/researchworld-apex-flash-five-20260912T205639Z/rw-data", "disclosure": ["budget", "gates", "graph", "roles", "world"], "instruction_provenance": {"source": "researchworld-submitted-task", "facet": "agent_input", "verification": "submitted-task sha256", "native_effective_input": "unknown"}, "live": true, "live_interval_sec": 60, "live_max_age_sec": 600};</script>
<script>
const qs = new URLSearchParams(location.search);
const TOKEN = qs.get('t');
// One renderer, two data sources. A published page sets window.RW_STATIC and
// every API path resolves to a file instead of a server; keeping a single
// renderer means the page people share is the page that was exercised locally,
// not a second implementation that drifts from it.
const STATIC = (typeof window !== 'undefined' && window.RW_STATIC) || null;
const LIVE = Boolean(STATIC && STATIC.live);
const LIVE_INTERVAL_MS = LIVE
  ? Math.max(15000, Number(STATIC.live_interval_sec || 60) * 1000) : 300000;
const LIVE_MAX_AGE_SEC = LIVE
  ? Math.max(60, Number(STATIC.live_max_age_sec || 600)) : Infinity;
const staticPath = p => {
  const parts = p.replace(/^\/api\//, '').split('/');
  if (parts[0] === 'graph') return 'graph.json';
  if (parts[0] === 'worlds' && parts.length === 1) return 'worlds.json';
  if (parts[0] === 'worlds' && parts.length === 2) return 'worlds/' + parts[1] + '.json';
  if (parts.length === 3 && parts[2] === 'archive') return 'archive/' + parts[1] + '.json';
  if (parts.length === 3 && parts[2] === 'executions') return 'executions/' + parts[1] + '.json';
  if (parts.length === 4 && ['agent', 'instruction'].includes(parts[2])) return parts[2] + '/' + parts[1] + '/' + parts[3] + '.json';
  return null;
};
const api = p => {
  if (STATIC) {
    const file = staticPath(p);
    // A path with no published file is a 404, not an error: the reader simply
    // was not granted that facet.
    if (!file) return Promise.resolve(new Response('{}', {status: 404}));
    // graph.json describes the organization's fixed shape, not a world, so it
    // ships beside the renderer and is fetched relative to the page. World
    // data comes from wherever it was published to, which may be a different
    // host entirely.
    const base = file === 'graph.json' ? '.' : STATIC.data.replace(/\/$/, '');
    return fetch(base + '/' + file, {cache: 'no-cache'});
  }
  return fetch(p + (p.includes('?') ? '&' : '?') + (TOKEN ? 't=' + TOKEN : ''),
               {headers: etags[p] ? {'If-None-Match': etags[p]} : {}});
};
const etags = {};
let GRAPH = null, SNAP = null, WID = qs.get('world') || '', TAB = 'roles', SEL = null;
let paused = false, timer = null, feedError = null;

const feedAsOf = snapshot => {
  const ledger = snapshot && snapshot.freshness && snapshot.freshness.ledger;
  return ledger && ledger.as_of !== null && ledger.as_of !== undefined
    ? ledger.as_of : snapshot && snapshot.collected_at;
};
const feedAge = snapshot => {
  const asOf = feedAsOf(snapshot);
  return asOf ? Math.max(0, Date.now() / 1000 - asOf) : Infinity;
};
function updateFeedStatus() {
  const node = document.getElementById('feedstatus');
  if (!node) return;
  node.className = 'feedstatus';
  if (feedError) {
    node.className += ' error';
    node.textContent = (LIVE ? 'shared feed unavailable' : 'observation unavailable') +
      (SNAP ? ' · showing last known data' : '');
    return;
  }
  if (!STATIC) {
    node.className += ' live';
    node.textContent = 'local read-only observation';
    return;
  }
  if (!LIVE) {
    node.textContent = 'static snapshot · refresh requires republishing';
    return;
  }
  if (!SNAP) {
    node.className += ' stale';
    node.textContent = 'shared live feed · waiting for first snapshot';
    return;
  }
  const age = feedAge(SNAP), ledger = SNAP.freshness && SNAP.freshness.ledger;
  const stale = !Number.isFinite(age) || age > LIVE_MAX_AGE_SEC || (ledger && ledger.stale);
  node.className += stale ? ' stale' : ' live';
  node.textContent = stale ? 'shared feed stale' : 'shared live feed';
  node.textContent += ' · data ' + (Number.isFinite(age) ? Math.round(age) + 's old' : 'age unknown') +
    ' · poll ' + Math.round(LIVE_INTERVAL_MS / 1000) + 's · max ' + Math.round(LIVE_MAX_AGE_SEC / 60) + 'm';
}
function markFeedSuccess() {
  feedError = null;
  updateFeedStatus();
}
function markFeedFailure() {
  feedError = true;
  updateFeedStatus();
}

const el = (t, a = {}, kids = []) => {
  const n = document.createElementNS(a.svg ? 'http://www.w3.org/2000/svg' : 'http://www.w3.org/1999/xhtml', t);
  for (const [k, v] of Object.entries(a)) if (k !== 'svg' && v !== null && v !== undefined) n.setAttribute(k, v);
  for (const kid of [].concat(kids)) n.appendChild(typeof kid === 'string' ? document.createTextNode(kid) : kid);
  return n;
};
const svgEl = (t, a = {}, kids = []) => el(t, Object.assign({svg: 1}, a), kids);
const ago = ts => {
  if (!ts) return '—';
  const d = Math.max(0, Date.now() / 1000 - ts);
  if (d < 90) return Math.round(d) + 's';
  if (d < 5400) return Math.round(d / 60) + 'm';
  return Math.round(d / 3600) + 'h';
};
const short = r => (GRAPH && GRAPH.short && GRAPH.short[r]) || r;
// A published page may withhold whole sections, so every section access below
// tolerates absence. A blank page is a worse answer than a partial one.
const roleOf = r => (SNAP && SNAP.roles ? SNAP.roles[r] : null) || {};
const owns = (value, key) => value !== null && typeof value === 'object' &&
  Object.prototype.hasOwnProperty.call(value, key);
const isRecord = value => value !== null && typeof value === 'object' && !Array.isArray(value);
const unavailableWorldData = () => {
  if (!STATIC) return 'unavailable in this snapshot';
  if (Array.isArray(STATIC.disclosure) && !STATIC.disclosure.includes('world')) {
    return 'not published at this disclosure level';
  }
  return 'unavailable in this published snapshot';
};
const explicitValue = (record, key, unavailable = unavailableWorldData()) => {
  if (!owns(record, key)) return {text: unavailable, present: false, configured: false};
  const value = record[key];
  if (value === null || value === '') return {text: 'not configured', present: true, configured: false};
  return {text: String(value), present: true, configured: true};
};
const exactTime = value => {
  if (value === null || value === undefined || value === '') return 'unavailable';
  const date = typeof value === 'number' ? new Date(value * 1000) : new Date(value);
  return Number.isNaN(date.getTime()) ? 'unavailable' : date.toISOString().replace('.000Z', 'Z');
};
const withUnit = (value, unit) => value.configured ? value.text + unit : value.text;
const fact = (label, value) => el('div', {class: 'fact'}, [
  el('span', {}, label), el('code', {}, String(value))]);

function copyButton(text, label) {
  const button = el('button', {}, label || 'copy');
  button.onclick = async () => {
    if (typeof navigator === 'undefined' || !navigator.clipboard || !navigator.clipboard.writeText) {
      button.textContent = 'copy unavailable';
      return;
    }
    try {
      await navigator.clipboard.writeText(text);
      button.textContent = 'copied';
      setTimeout(() => { button.textContent = label || 'copy'; }, 1600);
    } catch (_) {
      button.textContent = 'copy failed';
    }
  };
  return button;
}

function worldWorkerField(worker, harbor, key) {
  if (owns(worker, key)) return explicitValue(worker, key);
  if (owns(harbor, key)) return explicitValue(harbor, key);
  return explicitValue(null, key);
}

function roleWorkerField(worker, harbor, override, key, unit) {
  const overridden = explicitValue(override, key);
  if (overridden.present) {
    return withUnit(overridden, unit || '') + ' (override)';
  }
  const inherited = worldWorkerField(worker, harbor, key);
  return withUnit(inherited, unit || '') + (inherited.present ? ' (inherited)' : '');
}

function observedWorker(worker, status) {
  if (!isRecord(worker)) {
    return el('span', {class: 'fresh'}, status === 'never-ran'
      ? 'no execution observed' : 'worker provenance unavailable');
  }
  const box = el('div', {class: 'worker-lines'});
  for (const [label, key] of [['backend', 'backend'], ['agent', 'agent'], ['provider/model', 'model']]) {
    const value = explicitValue(worker, key, 'unavailable in execution record');
    box.appendChild(el('div', {}, [el('span', {}, label + ': '), el('code', {}, value.text)]));
  }
  return box;
}

function drawWorldInput() {
  const root = document.getElementById('worldinput');
  root.textContent = '';
  const world = SNAP && isRecord(SNAP.world) ? SNAP.world : null;
  const config = world && isRecord(world.world_config) ? world.world_config : null;
  const worker = config && isRecord(config.worker) ? config.worker : null;
  const harbor = world && isRecord(world.harbor) ? world.harbor : null;
  const revision = explicitValue(world, 'config_revision');
  const digest = explicitValue(world, 'config_digest');

  const provenance = [];
  if (STATIC) {
    provenance.push('published ' + exactTime(STATIC.published_at));
    provenance.push('world observation collected ' + exactTime(SNAP && SNAP.collected_at));
  } else {
    provenance.push('read-only host observation collected ' + exactTime(SNAP && SNAP.collected_at));
  }
  provenance.push('effective configuration revision ' + revision.text);
  if (LIVE) {
    provenance.push('shared feed poll ' + Math.round(LIVE_INTERVAL_MS / 1000) + 's · max expected delay ' +
      Math.round(LIVE_MAX_AGE_SEC / 60) + 'm');
  }
  root.appendChild(el('div', {class: 'input-head'}, [
    el('div', {}, [el('h2', {}, 'World input / run definition'),
      el('div', {class: 'fresh'}, provenance.join(' · '))])
  ]));

  const grid = el('div', {class: 'input-grid'});
  const topic = el('section', {class: 'input-block'});
  const topicTitle = el('div', {class: 'input-title'}, [el('h3', {}, 'Original research topic')]);
  const topicValue = explicitValue(world, 'topic');
  if (topicValue.present && topicValue.configured) {
    topicTitle.appendChild(el('span', {class: 'sp'}));
    topicTitle.appendChild(copyButton(topicValue.text, 'copy topic'));
  }
  topic.appendChild(topicTitle);
  topic.appendChild(el('pre', {class: 'input-topic'}, topicValue.text));
  topic.appendChild(el('p', {class: 'input-note'}, topicValue.present && topicValue.configured
    ? 'This is the complete world topic from the disclosed snapshot, not a paper title or later summary.'
    : 'No topic text is available here; the observer does not infer it from titles or later summaries.'));
  grid.appendChild(topic);

  const runtime = el('section', {class: 'input-block'});
  runtime.appendChild(el('h3', {}, 'World worker defaults for future executions'));
  const runtimeFacts = el('div', {class: 'fact-grid'});
  for (const [label, key] of [
    ['Backend', 'backend'], ['Agent implementation', 'agent'], ['Provider / model', 'model']
  ]) {
    runtimeFacts.appendChild(fact(label, worldWorkerField(worker, harbor, key).text));
  }
  runtime.appendChild(runtimeFacts);
  runtime.appendChild(el('p', {class: 'input-note'},
    'Defaults are configuration, not proof of what every historical execution used. ' +
    'Role overrides are shown below; each execution retains its recorded provenance.'));
  grid.appendChild(runtime);

  const definition = el('section', {class: 'input-block wide'});
  definition.appendChild(el('h3', {}, 'Effective configuration in this snapshot'));
  const configFacts = el('div', {class: 'fact-grid'});
  configFacts.appendChild(fact('Revision', revision.text));
  configFacts.appendChild(fact('Digest (SHA-256)', digest.text));
  const maxExecutions = worldWorkerField(worker, harbor, 'max_executions');
  const maxAttempts = worldWorkerField(worker, harbor, 'max_attempts');
  configFacts.appendChild(fact('Execution budget', withUnit(maxExecutions, ' executions')));
  configFacts.appendChild(fact('Retry limit', withUnit(maxAttempts, ' attempts')));
  configFacts.appendChild(fact('Agent timeout', withUnit(worldWorkerField(worker, harbor, 'agent_timeout_sec'), 's')));
  configFacts.appendChild(fact('Build timeout', withUnit(worldWorkerField(worker, harbor, 'build_timeout_sec'), 's')));
  configFacts.appendChild(fact('Host grace', withUnit(worldWorkerField(worker, harbor, 'host_grace_sec'), 's')));
  const roles = config && Array.isArray(config.roles) ? config.roles : null;
  const edges = config && Array.isArray(config.edges) ? config.edges : null;
  configFacts.appendChild(fact('Organization', roles && edges
    ? roles.length + ' positions · ' + edges.length + ' collaboration edges'
    : unavailableWorldData()));
  definition.appendChild(configFacts);
  definition.appendChild(el('p', {class: 'input-note'}, revision.present
    ? 'Revision ' + revision.text + ' is the effective configuration captured by this view. ' +
      'Configuration changes apply to future claims; use execution provenance for historical runs.'
    : 'Configuration revision provenance is unavailable; do not treat displayed defaults as historical execution settings.'));

  definition.appendChild(el('h4', {}, 'Role-specific worker overrides'));
  const overridesAvailable = worker && owns(worker, 'roles') && isRecord(worker.roles);
  const overrides = overridesAvailable ? Object.entries(worker.roles) : [];
  if (!overridesAvailable) {
    definition.appendChild(el('p', {class: 'empty'}, unavailableWorldData()));
  } else if (!overrides.length) {
    definition.appendChild(el('p', {class: 'fresh'}, 'No role-specific worker overrides in this configuration.'));
  } else {
    const wrap = el('div', {class: 'override-wrap'});
    wrap.appendChild(table(
      ['position', 'agent implementation', 'provider / model', 'agent timeout', 'build timeout', 'host grace'],
      overrides.map(([role, override]) => [
        role,
        roleWorkerField(worker, harbor, override, 'agent'),
        roleWorkerField(worker, harbor, override, 'model'),
        roleWorkerField(worker, harbor, override, 'agent_timeout_sec', 's'),
        roleWorkerField(worker, harbor, override, 'build_timeout_sec', 's'),
        roleWorkerField(worker, harbor, override, 'host_grace_sec', 's'),
      ])));
    definition.appendChild(wrap);
  }

  if (roles && edges) {
    const organization = el('details', {class: 'input-config'});
    organization.appendChild(el('summary', {}, 'View position definitions and collaboration edges'));
    organization.appendChild(table(['position', 'responsibility', 'deliverables'], roles.map(item => {
      const entry = isRecord(item) ? item : {};
      return [entry.role || '—', entry.responsibility || '—',
        Array.isArray(entry.deliverables) ? entry.deliverables.join(', ') : '—'];
    })));
    organization.appendChild(el('h4', {}, 'Collaboration edges'));
    organization.appendChild(table(['from', 'to'], edges.map(edge => {
      const pair = Array.isArray(edge) ? edge : [];
      return [pair[0] || '—', pair[1] || '—'];
    })));
    definition.appendChild(organization);
  }
  if (config) {
    const complete = el('details', {class: 'input-config'});
    complete.appendChild(el('summary', {}, 'View complete disclosed effective configuration'));
    complete.appendChild(el('p', {class: 'input-note'},
      'Secret-free observer projection; no provider or control credentials are read for this view.'));
    complete.appendChild(el('pre', {}, JSON.stringify(config, null, 2)));
    definition.appendChild(complete);
  } else {
    definition.appendChild(el('p', {class: 'empty'},
      'Complete effective configuration ' + unavailableWorldData() + '.'));
  }
  grid.appendChild(definition);
  root.appendChild(grid);
}

async function loadWorlds() {

    r = await api('/api/worlds');
  } catch (_) {
    markFeedFailure();
    return;
  }
  if (!r.ok) {
    markFeedFailure();
    return;
  }
  markFeedSuccess();
  const data = await r.json();
  const sel = document.getElementById('worlds');
  const current = sel.value;
  sel.textContent = '';
  sel.appendChild(el('option', {value: ''}, '— ' + data.shown + ' of ' + data.total + ' worlds —'));
  for (const w of data.worlds) {
    sel.appendChild(el('option', {value: w.world_id},
      w.world_id + ' · ' + w.container_status + ' · ' + w.roles_executed + '/8 roles'));

  const cards = document.getElementById('cards');
  cards.textContent = '';
  if (!data.worlds.length) cards.appendChild(el('p', {class: 'empty'}, 'No active worlds. Add --all to include test leftovers.'));
  for (const w of data.worlds) {
    const budget = w.harbor && w.harbor.max_executions
      ? Math.min(100, 100 * (w.receipts || 0) / w.harbor.max_executions) : 0;
    const topic = explicitValue(w, 'topic', unavailableWorldData());
    const listedAgent = explicitValue(w.harbor, 'agent', 'unavailable');
    const listedModel = explicitValue(w.harbor, 'model', 'unavailable');
    const card = el('div', {class: 'card'}, [
      el('h3', {}, w.world_id),
      el('p', {}, topic.text),

        ' ',
        el('span', {class: 'pill'}, w.roles_executed + '/8 roles'),
        ' ',

function selectWorld(wid) {
  WID = wid;
  SEL = null;
  DRILL = null;
  TRAIL.length = 0;
  invalidateDetails();
  document.getElementById('drill').hidden = true;
  document.getElementById('worlds').value = wid;
  document.getElementById('home').hidden = !!wid;
  document.getElementById('detail').hidden = !wid;
  history.replaceState(null, '', '?' + (TOKEN ? 't=' + TOKEN + '&' : '') + 'world=' + wid);
  if (wid) refresh(true);
}

async function refresh(force) {
  if (!WID || (paused && !force)) return;
  const wid = WID;
  const path = '/api/worlds/' + wid;
  let r;
  try {
    r = await api(path);
  } catch (_) {
    if (wid === WID) markFeedFailure();
    return;
  }
  if (wid !== WID) return;
  if (!r.ok && r.status !== 304) {
    markFeedFailure();
    return;
  }
  markFeedSuccess();
  if (r.status !== 304) {
    let snap;
    try {
      snap = await r.json();
    } catch (_) {
      markFeedFailure();
      return;
    }
    if (wid !== WID) return;
    etags[path] = r.headers.get('ETag');
    SNAP = snap;
    render();
  }
  // Receipts/trajectories can appear without a ledger snapshot change.
  invalidateDetails();
  if (DRILL) renderDrill();
}

function render() {
  if (!SNAP || !GRAPH) return;
  document.getElementById('fresh').textContent =
    ((SNAP.freshness || {}).label || '') +
    (STATIC && STATIC.published_at
      ? ' · published ' + exactTime(STATIC.published_at) + ' (' + ago(STATIC.published_at) + ' ago)' : '');
  updateFeedStatus();
  drawWorldInput();
  drawGraph();
  drawTabs();
}

let GRAPH_DOM = null;
function drawGraph() {
  const svg = document.getElementById('graph');
  const now = Date.now() / 1000;
  const traffic = {};
  for (const e of ((SNAP.graph || {}).edges || [])) traffic[[e.a, e.b].sort().join('|')] = e;
  // Build the fixed topology once. Polls only mutate attributes and text, so
  // SVG animation timelines and browser hit targets survive data refreshes.
  if (!GRAPH_DOM) {
    const edges = svgEl('g'), nodes = svgEl('g');
    const edgeMap = {}, nodeMap = {};
    const routeFor = (a, b, index) => {
      const [x1, y1] = GRAPH.layout[a], [x2, y2] = GRAPH.layout[b];
      const dx = x2 - x1, dy = y2 - y1, length = Math.max(1, Math.hypot(dx, dy));
      const ux = dx / length, uy = dy / length;
      // Start/end at the node boundary, keeping traffic lines out of node bodies.
      const start = [x1 + ux * 25, y1 + uy * 25];
      const end = [x2 - ux * 25, y2 - uy * 25];
      const routes = GRAPH.edge_routes || {};
      let route = routes[`${a}|${b}`];
      let reversed = false;
      if (!route) { route = routes[`${b}|${a}`]; reversed = Boolean(route); }
      if (route) {
        const c1 = reversed ? route.c2 : route.c1;
        const c2 = reversed ? route.c1 : route.c2;
        return {
          d: `M${start[0]},${start[1]} C${c1[0]},${c1[1]} ${c2[0]},${c2[1]} ${end[0]},${end[1]}`,
          label: route.label,
        };
      }
      // Keep old/static graph payloads renderable while they roll out. The
      // explicit routes above are the normal path for the current payload.
      const nx = -uy, ny = ux, bend = ((index % 5) - 2) * 13;
      const mx = (x1 + x2) / 2 + nx * bend, my = (y1 + y2) / 2 + ny * bend;
      const c1 = [x1 + (mx - x1) * 2 / 3, y1 + (my - y1) * 2 / 3];
      const c2 = [x2 + (mx - x2) * 2 / 3, y2 + (my - y2) * 2 / 3];
      return {
        d: `M${start[0]},${start[1]} C${c1[0]},${c1[1]} ${c2[0]},${c2[1]} ${end[0]},${end[1]}`,
        label: [mx + nx * 7, my + ny * 7 - 3],
      };
    };
    GRAPH.edges.forEach(([a, b], index) => {
      if (!GRAPH.layout[a] || !GRAPH.layout[b]) return;
      const route = routeFor(a, b, index);
      const d = route.d;
      const path = svgEl('path', {class: 'edge', d});
      const label = svgEl('text', {class: 'elabel', x: route.label[0], y: route.label[1]});
      const hit = svgEl('path', {class: 'hit', d});
      hit.appendChild(svgEl('title'));
      hit.onclick = () => openDrill('edge', [a, b]);
      edges.append(path, label, hit);
      edgeMap[[a, b].sort().join('|')] = {path, label, hit, a, b};
    });
    GRAPH.roles.forEach(role => {
      if (!GRAPH.layout[role]) return;
      const [x, y] = GRAPH.layout[role];
      const g = svgEl('g', {class: 'node'});
      const pulse = svgEl('circle', {class: 'pulse', cx: x, cy: y, r: 24, fill: 'var(--accent)'});
      const main = svgEl('circle', {class: 'main', cx: x, cy: y, r: 22});
      const name = svgEl('text', {x, y: y + 38});
      const sub = svgEl('text', {class: 'sub', x, y: y + 50});
      const marks = svgEl('g');
      const title = svgEl('title');
      g.append(pulse, main, name, sub, marks, title);
      g.onclick = () => { SEL = role; TAB = 'repos'; render(); openDrill('role', role); };
      nodes.appendChild(g);
      nodeMap[role] = {g, pulse, main, name, sub, marks, title, x, y};
    });
    svg.append(edges, nodes);
    GRAPH_DOM = {edgeMap, nodeMap};
  }
  for (const [key, item] of Object.entries(GRAPH_DOM.edgeMap)) {
    const t = traffic[key] || {total: 0, a_to_b: 0, b_to_a: 0, last_at: null};
    const live = t.last_at && (now - t.last_at) < 300;
    item.path.setAttribute('class', 'edge' + (t.total === 0 ? ' none' : live ? ' live' : ''));
    item.path.setAttribute('stroke-width', (1 + 2.2 * Math.log1p(t.total)).toFixed(2));
    item.path.setAttribute('opacity', t.total === 0 ? 0.28 : live ? 1 : 0.55);
    item.label.textContent = t.total ? t.a_to_b + '-><-' + t.b_to_a : '';
    item.hit.firstChild.textContent = short(item.a) + ' <-> ' + short(item.b) + '\n' +
      (t.total ? t.total + ' messages - click to read them' : 'never used');
  }
  for (const role of GRAPH.roles) {
    const v = roleOf(role), item = GRAPH_DOM.nodeMap[role];
    if (!item) continue;
    const fill = v.status === 'running' ? 'var(--accent)' : v.status === 'failed' ? 'var(--bad)'
      : v.status === 'idle' ? 'var(--ok)' : 'var(--idle)';
    const done = (v.executions && v.executions.complete) || 0;
    item.g.setAttribute('class', 'node' + (SEL === role ? ' sel' : ''));
    item.pulse.style.display = v.status === 'running' ? '' : 'none';
    item.main.setAttribute('fill', fill);
    item.main.setAttribute('stroke', 'var(--line)');
    item.main.setAttribute('stroke-width', Math.min(4, 1 + done));
    item.main.setAttribute('stroke-dasharray', v.status === 'never-ran' ? '3 3' : '');
    item.main.setAttribute('fill-opacity', v.status === 'never-ran' ? 0.15 : 0.9);
    item.name.textContent = short(role);
    item.sub.textContent = (v.worker && v.worker.agent ? v.worker.agent + ' - ' + done : 'never ran');
    item.marks.textContent = '';
    const d = (v.repo && v.repo.deliverables) || null;
    if (d) {
      const total = d.expected.length, w = 9, gap = 3;
      const startX = item.x - (total * w + (total - 1) * gap) / 2;
      d.expected.forEach((name, i) => item.marks.appendChild(svgEl('rect', {
        x: startX + i * (w + gap), y: item.y + 64, width: w, height: 9, rx: 2,
        fill: d.present.includes(name) ? 'var(--ok)' : 'none', stroke: 'var(--muted)', 'stroke-width': 1
      })));
    }
    item.title.textContent = role + '\n' + (v.responsibility || '');
  }
}

  for (const r of rows) body.appendChild(el('tr', {}, r.map(c => el('td', {}, [c instanceof Node ? c : String(c ?? '—')]))));
  t.appendChild(body);
  return t;
};

// ---- drill-down ------------------------------------------------------------
// Three ways in, one panel: a role node opens its repository, an edge opens the
// conversation that crossed it, an execution opens what the agent actually did.
// Deep data is fetched lazily -- a world can hold forty trajectories and the
// overview must not pay for them.
let ARCHIVE = null, ARCHIVE_FOR = null, EXECS = null, EXECS_FOR = null;
const AGENTS = {}, INSTRUCTIONS = {};
let DRILL = null, DETAIL_GENERATION = 0, DRILL_RENDER = 0;
function invalidateDetails() {
  DETAIL_GENERATION++;
  ARCHIVE_FOR = EXECS_FOR = null;
  for (const cache of [AGENTS, INSTRUCTIONS]) {
    for (const key of Object.keys(cache)) delete cache[key];
  }
}

async function getArchive() {
  if (ARCHIVE_FOR === WID) return ARCHIVE;
  const wid = WID, generation = DETAIL_GENERATION;
  const r = await api('/api/worlds/' + wid + '/archive').catch(() => null);
  const value = (r && r.ok) ? await r.json() : {manifest: null, repos: {}};
  if (wid === WID && generation === DETAIL_GENERATION) {
    ARCHIVE = value; ARCHIVE_FOR = wid;
  }
  return value;
}
async function getExecutions() {
  if (EXECS_FOR === WID) return EXECS;
  const wid = WID, generation = DETAIL_GENERATION;
  const r = await api('/api/worlds/' + wid + '/executions').catch(() => null);
  const value = (r && r.ok) ? ((await r.json()).items || []) : [];
  if (wid === WID && generation === DETAIL_GENERATION) {
    EXECS = value; EXECS_FOR = wid;
  }
  return value;
}
async function getRecord(channel, cache, id) {
  const wid = WID, generation = DETAIL_GENERATION, key = wid + '/' + id;
  if (cache[key] !== undefined) return cache[key];
  const r = await api('/api/worlds/' + wid + '/' + channel + '/' + id).catch(() => null);
  const value = r ? await r.json().catch(() => null) : null;
  if (wid === WID && generation === DETAIL_GENERATION) cache[key] = value;
  return value;
}
const getAgent = id => getRecord('agent', AGENTS, id);
const getInstruction = id => getRecord('instruction', INSTRUCTIONS, id);

const TRAIL = [];
const sameDrill = (a, b) => a && b && a.kind === b.kind &&
  String(a.key) === String(b.key);
function openDrill(kind, key, sub) {
  const next = {kind, key, sub: sub || null, pick: null};
  // Re-opening what is already on screen is a no-op, not a new trail entry:
  // clicking a node twice must not make "back" walk through duplicates.
  if (sameDrill(DRILL, next)) { DRILL.sub = next.sub || DRILL.sub; renderDrill(); return; }
  if (DRILL) TRAIL.push(DRILL);
  if (TRAIL.length > 40) TRAIL.shift();
  DRILL = next;
  renderDrill();
}
function backDrill() {
  DRILL = TRAIL.pop() || null;
  if (!DRILL) { closeDrill(); return; }
  renderDrill();
}
function closeDrill() {
  DRILL = null;
  TRAIL.length = 0;
  document.getElementById('drill').hidden = true;
}
const drillLabel = d => d.kind === 'edge' ? d.key.map(short).join(' ↔ ')
  : d.kind === 'exec' ? 'execution ' + d.key.slice(0, 8) : short(d.key);

const DRILL_TABS = {
  role: ['brief', 'files', 'history', 'issues', 'pulls', 'executions'],
  edge: ['messages'],
  exec: ['trace'],
};

async function renderDrill() {
  const serial = ++DRILL_RENDER, wid = WID, selected = DRILL;
  const panel = document.getElementById('drill');
  if (!DRILL) { panel.hidden = true; return; }
  panel.hidden = false;
  const tabs = DRILL_TABS[DRILL.kind] || [];
  if (!DRILL.sub) DRILL.sub = tabs[0];
  document.getElementById('drillcrumb').textContent =
    [WID].concat(TRAIL.map(drillLabel)).concat([drillLabel(DRILL)]).join('  ›  ');
  const back = document.getElementById('drillback');
  back.hidden = !TRAIL.length;
  if (TRAIL.length) back.textContent = '← ' + drillLabel(TRAIL[TRAIL.length - 1]);
  document.getElementById('drilltitle').textContent =
    DRILL.kind === 'edge' ? DRILL.key.map(short).join('  ↔  ')
      : DRILL.kind === 'exec' ? 'execution ' + DRILL.key.slice(0, 12)
      : DRILL.key;
  const bar = document.getElementById('drilltabs');
  bar.textContent = '';
  for (const name of tabs) {
    const b = el('button', {'aria-pressed': String(DRILL.sub === name)}, name);
    b.onclick = () => { DRILL.sub = name; DRILL.pick = null; renderDrill(); };
    bar.appendChild(b);
  }
  const body = document.getElementById('drillbody');
  body.textContent = '';
  body.appendChild(el('p', {class: 'fresh'}, 'loading…'));
  let view;
  try {
    view = DRILL.kind === 'edge' ? await drillEdge()
      : DRILL.kind === 'exec' ? await drillExec()
      : await drillRole();
  } catch (err) {
    view = el('p', {class: 'err'}, 'could not render: ' + err);
  }
  if (serial !== DRILL_RENDER || wid !== WID || selected !== DRILL) return;
  body.textContent = '';
  body.appendChild(view);
}

function notCaptured(what) {
  return el('p', {class: 'empty'},
    what + ' was not captured for this world. Repository depth is readable only ' +
    'while the world runs, so it has to be archived before the world stops.');
}

// Every cap the capture hit, stated. A drill-down that quietly shows the first
// N commits reads as "this is everything that happened".
function truncationNote(role) {
  const list = ((ARCHIVE && ARCHIVE.manifest && ARCHIVE.manifest.truncated) || [])
    .filter(t => !role || t.role === role);
  if (!list.length) return null;
  return el('p', {class: 'warnbar'},
    'truncated during capture: ' + list.map(t => t.what).join(', ') +
    ' — more exists than is shown here');
}

const pane = (left, right) => el('div', {class: 'pane'}, [left, right]);

function picker(items, label, onpick) {
  const box = el('div', {class: 'list'});
  if (!items.length) box.appendChild(el('p', {class: 'empty'}, 'nothing here'));
  for (const item of items) {
    const b = el('button', {'aria-pressed': String(DRILL.pick === item.key)}, label(item));
    b.onclick = () => { DRILL.pick = item.key; onpick(item); };
    box.appendChild(b);
  }
  return box;
}

const diffBlock = text => {
  const pre = el('pre', {class: 'diff'});
  for (const line of String(text || '').split('\n')) {
    const cls = line.startsWith('+') && !line.startsWith('+++') ? 'add'
      : line.startsWith('-') && !line.startsWith('---') ? 'del'
      : line.startsWith('@@') ? 'hunk' : '';
    pre.appendChild(el('span', cls ? {class: cls} : {}, line + '\n'));
  }
  return pre;
};

async function drillRole() {
  const role = DRILL.key, sub = DRILL.sub;
  const archive = await getArchive();
  const deep = (archive.repos || {})[role] || {};
  const live = roleOf(role).repo || {};
  const box = el('div');
  const note = truncationNote(role);
  if (note) box.appendChild(note);

  if (sub === 'brief') {
    const contract = ((GRAPH.contracts || {})[role]) || {};
    const view = roleOf(role);
    box.appendChild(el('h2', {}, 'position'));
    box.appendChild(el('p', {}, contract.responsibility || view.responsibility ||
      'no responsibility recorded for this role'));
    const deliverables = contract.deliverables || view.deliverables_expected || [];
    box.appendChild(el('p', {class: 'fresh'},
      'expected deliverables: ' + (deliverables.join(', ') || '—')));
    // The graph edges are this role's declared relationships: who it may hand
    // work to and who may hand work to it.
    const partners = (GRAPH.edges || [])
      .filter(([a, b]) => a === role || b === role)
      .map(([a, b]) => (a === role ? b : a));
    const wired = el('div');
    wired.appendChild(el('p', {class: 'fresh', style: 'margin-top:8px'},
      'works with ' + partners.length + ' other positions — click one to read that conversation'));
    for (const other of partners) {
      const link = el('button', {style: 'margin:2px 4px 2px 0'}, short(other));
      link.onclick = () => openDrill('edge', [role, other]);
      wired.appendChild(link);
    }
    box.appendChild(wired);

    const runs = (await getExecutions()).filter(e => e.role === role);
    const newest = runs[runs.length - 1];
    if (!newest) {
      box.appendChild(el('p', {class: 'empty'}, view.status === 'never-ran' && !STATIC
        ? 'No execution or submitted-task record observed for this position.'
        : 'No submitted-task record available yet, or input provenance is withheld.'));
      return box;
    }
    box.appendChild(await instructionPanel(newest.execution_id));
    const open = el('button', {}, 'open execution / sanitized trajectory');
    open.onclick = () => openDrill('exec', newest.execution_id);
    box.appendChild(open);
    return box;
  }

  if (sub === 'files') {
    const contents = deep.contents || {};
    const names = Object.keys(contents).length ? Object.keys(contents).sort()
      : (live.files || []).slice().sort();
    if (!names.length) { box.appendChild(notCaptured('File content')); return box; }
    const out = el('div', {}, [el('p', {class: 'fresh'}, names.length + ' files')]);
    const show = el('div');
    show.appendChild(el('p', {class: 'fresh'}, 'pick a file'));
    const list = picker(names.map(n => ({key: n, name: n})), i => i.name, item => {
      show.textContent = '';
      const entry = contents[item.key];
      if (!entry) { show.appendChild(notCaptured('This file’s content')); return; }
      if (entry.binary) { show.appendChild(el('p', {class: 'empty'}, 'binary file')); return; }
      show.appendChild(el('h2', {}, item.key));
      show.appendChild(el('pre', {}, entry.text || ''));
      renderDrill.marker = 1;
    });
    out.appendChild(pane(list, show));
    box.appendChild(out);
    return box;
  }

  if (sub === 'history') {
    const history = deep.history || [];
    if (!history.length) { box.appendChild(notCaptured('Commit history')); return box; }
    const show = el('div', {}, [el('p', {class: 'fresh'}, 'pick a commit')]);
    const list = picker(history.map(c => ({key: c.sha, c})),
      i => (i.c.sha || '').slice(0, 8) + ' · ' + (i.c.message || '').split('\n')[0].slice(0, 40),
      item => {
        show.textContent = '';
        const c = item.c;
        show.appendChild(el('h2', {}, (c.message || '').split('\n')[0]));
        show.appendChild(el('p', {class: 'fresh'},
          (c.author || '?') + ' · ' + (c.created_at || '') + ' · ' + (c.sha || '').slice(0, 12)));
        // The files a commit touched are the only trustworthy answer to
        // "what did this agent change" -- the tool transcript cannot say.
        show.appendChild(el('p', {class: 'mono'}, 'changed: ' + ((c.files || []).join(', ') || '—')));
        const diff = (deep.diffs || {})[c.sha];
        show.appendChild(diff ? diffBlock(diff) : el('p', {class: 'empty'}, 'diff not captured'));
      });
    box.appendChild(pane(list, show));
    return box;
  }

  if (sub === 'issues') {
    const items = ((live.issues || {}).items) || ((deep.issues || {}).items) || [];
    if (!items.length) { box.appendChild(el('p', {class: 'empty'}, 'no issues')); return box; }
    const comments = deep.issue_comments || {};
    for (const issue of items) {
      const wrap = el('div', {class: 'msg'});
      wrap.appendChild(el('h4', {}, '#' + issue.number + ' ' + (issue.title || '')));
      wrap.appendChild(el('p', {class: 'fresh'},
        issue.state + ' · opened by ' + short(issue.author || '?') + ' · ' + (issue.created_at || '')));
      if (issue.body) wrap.appendChild(el('pre', {}, issue.body));
      for (const remark of comments[String(issue.number)] || []) {
        wrap.appendChild(el('p', {class: 'fresh', style: 'margin-top:6px'},
          short(remark.author || '?') + ' commented ' + (remark.created_at || '')));
        wrap.appendChild(el('pre', {}, remark.body || ''));
      }
      box.appendChild(wrap);
    }
    return box;
  }

  if (sub === 'pulls') {
    const items = ((live.pulls || {}).items) || ((deep.pulls || {}).items) || [];
    if (!items.length) { box.appendChild(el('p', {class: 'empty'}, 'no pull requests')); return box; }
    const reviews = deep.reviews || {};
    for (const pull of items) {
      const wrap = el('div', {class: 'msg'});
      wrap.appendChild(el('h4', {}, '#' + pull.number + ' ' + (pull.title || '')));
      wrap.appendChild(el('p', {class: 'fresh'},
        pull.state + (pull.merged ? ' · merged' : '') + ' · by ' + short(pull.author || '?')));
      if (pull.body) wrap.appendChild(el('pre', {}, pull.body));
      const got = reviews[String(pull.number)] || [];
      if (got.length) {
        for (const review of got) {
          wrap.appendChild(el('p', {class: 'fresh', style: 'margin-top:6px'},
            short(review.author || '?') + ' · ' + (review.state || 'review')));
          if (review.body) wrap.appendChild(el('pre', {}, review.body));
        }
      } else {
        // Honest about a real gap: the review roles work by commenting, so
        // Forgejo holds no review object even for a reviewed-and-merged PR.
        wrap.appendChild(el('p', {class: 'fresh', style: 'margin-top:6px'},
          'no formal review record — review discussion happens as issue comments'));
      }
      box.appendChild(wrap);
    }
    return box;
  }

  const runs = (await getExecutions()).filter(e => e.role === role);
  if (!runs.length) { box.appendChild(el('p', {class: 'empty'}, 'this role never executed')); return box; }
  box.appendChild(table(['execution', 'status', 'elapsed', 'effects', ''],
    runs.map(run => {
      const open = el('button', {}, 'open trace');
      open.onclick = () => openDrill('exec', run.execution_id);
      return [el('code', {}, (run.execution_id || '').slice(0, 12)),
        el('span', {class: 'pill ' + (run.status === 'complete' ? 'ok' : 'bad')}, run.status || '—'),
        run.elapsed_seconds ? Math.round(run.elapsed_seconds) + 's' : '—',
        (run.effects || []).map(e => e.kind).join(', ') || '—', open];
    })));
  return box;
}

async function drillEdge() {
  const [a, b] = DRILL.key;
  const items = ((SNAP.messages && SNAP.messages.items) || []).filter(m =>
    (m.from === a && m.to === b) || (m.from === b && m.to === a));
  const box = el('div');
  const edge = (((SNAP.graph || {}).edges) || []).find(e =>
    [e.a, e.b].sort().join('|') === [a, b].sort().join('|'));
  box.appendChild(el('p', {class: 'fresh'}, edge
    ? (edge.total + ' messages · ' + short(a) + '→' + short(b) + ' ' + edge.a_to_b +
       ' · ' + short(b) + '→' + short(a) + ' ' + edge.b_to_a)
    : 'this relationship has never been used'));
  if (!items.length) {
    box.appendChild(el('p', {class: 'empty'},
      edge && edge.total ? 'Message detail is withheld at this disclosure level.'
        : 'Nothing has crossed this edge.'));
    return box;
  }
  for (const m of items.slice().sort((x, y) => (y.at || 0) - (x.at || 0))) {
    const wrap = el('div', {class: 'msg'});
    wrap.appendChild(el('h4', {}, m.title || ('#' + ((m.ref || {}).number ?? ''))));
    wrap.appendChild(el('p', {class: 'fresh'},
      short(m.from || '?') + ' → ' + short(m.to) + ' · ' + m.kind +
      (m.action ? ' (' + m.action + ')' : '') + ' · ' + ago(m.at) + ' ago' +
      ' · ' + (m.status || '')));
    if (m.body) wrap.appendChild(el('pre', {}, m.body));
    box.appendChild(wrap);
  }
  return box;
}

async function instructionPanel(id) {
  const box = el('div', {}, [el('h2', {}, 'ResearchWorld submitted task')]);
  const record = await getInstruction(id);
  box.appendChild(el('p', {class: 'fresh'}, 'execution ' + id +
    ' · native effective input: unknown (not proven by Harbor ATIF)'));
  if (record && record.available && record.verified && typeof record.text === 'string') {
    box.appendChild(el('p', {class: 'fresh'},
      'source: ' + record.source + ' · storage: ' + record.storage_source + ' · metadata: ' + record.metadata_source +
      ' · verified submitted-task SHA-256: ' + record.instruction_digest +
      ' · disclosure: agent_input'));
    box.appendChild(el('pre', {}, record.text));
  } else {
    box.appendChild(el('p', {class: 'empty'}, (record && record.reason) ||
      'Exact submitted task unavailable or withheld.'));
    const trace = await getAgent(id);
    const task = ((trace || {}).steps || []).find(s => s.source === 'user' && typeof s.message === 'string');
    if (task) {
      box.appendChild(el('p', {class: 'warnbar'},
        'Degraded fallback: sanitized Harbor ATIF user message; may be adapter-synthesized, ' +
        'not independent evidence of submitted task or native model input. No verified task hash.'));
      box.appendChild(el('pre', {}, task.message + (task.message_truncated ? '\n[truncated at capture]' : '')));
    }
  }
  return box;
}

async function drillExec() {
  const id = DRILL.key;
  const record = await getAgent(id);
  const box = el('div');
  const run = (await getExecutions()).find(e => e.execution_id === id);
  box.appendChild(await instructionPanel(id));
  box.appendChild(el('h2', {}, 'Sanitized Harbor trajectory (not native input proof)'));
  if (run) {
    box.appendChild(el('p', {class: 'fresh'},
      short(run.role || '?') + ' · ' + (run.status || '') +
      (run.elapsed_seconds ? ' · ' + Math.round(run.elapsed_seconds) + 's' : '')));
    const recorded = key => explicitValue(run, key, 'unavailable in this execution record').text;
    box.appendChild(table(['recorded execution provenance', 'value'], [
      ['backend', recorded('backend')],
      ['agent implementation', recorded('agent')],
      ['provider / model', recorded('model')],
      ['configuration revision', recorded('config_revision')],
      ['configuration digest', recorded('config_digest')],
    ]));
    box.appendChild(el('p', {class: 'input-note'},
      'Execution provenance is claim-time evidence; it may differ from the current world defaults above.'));
  } else {
    box.appendChild(el('p', {class: 'empty'}, 'Execution provenance unavailable.'));
  }
  if (!record || !record.available) {
    box.appendChild(el('p', {class: 'empty'},
      (record && record.reason) || 'No trajectory was captured for this execution.'));
    return box;
  }
  const m = record.metrics || {};
  box.appendChild(el('p', {class: 'fresh', style: 'margin-top:8px'},
    record.step_count + ' steps' +
    (m.total_prompt_tokens ? ' · ' + m.total_prompt_tokens.toLocaleString() + ' prompt tokens' : '') +
    (m.total_cost_usd ? ' · $' + m.total_cost_usd.toFixed(4) : '')));
  const steps = record.steps || [];
  if (!steps.length) {
    box.appendChild(el('p', {class: 'empty'}, 'Step detail is withheld at this disclosure level.'));
    return box;
  }
  for (const [index, step] of steps.entries()) {
    const calls = step.tool_calls || [];
    const results = (step.observation || {}).results || [];
    const label = ['system', 'developer', 'user'].includes(step.source) ? 'sanitized recorded input (possibly adapter fallback)'
      : calls.length ? calls.map(c => c.function_name).join(', ')
      : 'agent message';
    const item = el('details', {class: 'step'});
    item.appendChild(el('summary', {}, '#' + index + ' · ' + (step.source || '') + ' · ' + label));
    if (step.message) {
      item.appendChild(el('pre', {}, step.message +
        (step.message_truncated ? '\n[truncated at capture]' : '')));
    }
    for (const call of calls) {
      item.appendChild(el('p', {class: 'tool', style: 'margin:6px 0 2px'}, call.function_name));
      item.appendChild(el('pre', {}, (call.arguments || '') +
        (call.arguments_truncated ? '\n[truncated at capture]' : '')));
      const back = results.find(r => r.source_call_id === call.tool_call_id);
      if (back) {
        item.appendChild(el('p', {class: 'fresh', style: 'margin:6px 0 2px'}, 'result'));
        item.appendChild(el('pre', {}, (back.content || '') +
          (back.content_truncated ? '\n[truncated at capture]' : '')));
      }
    }
    if (step.metrics && step.metrics.prompt_tokens) {
      item.appendChild(el('p', {class: 'fresh'},
        step.metrics.prompt_tokens.toLocaleString() + ' prompt · ' +
        (step.metrics.completion_tokens || 0) + ' completion tokens'));
    }
    box.appendChild(item);
  }
  return box;
}

document.getElementById('drillclose').onclick = closeDrill;
document.getElementById('drillback').onclick = backDrill;

document.getElementById('worlds').onchange = e => selectWorld(e.target.value);
document.getElementById('pause').onclick = e => {
  paused = !paused;
  e.target.setAttribute('aria-pressed', String(paused));
  e.target.textContent = paused ? 'paused' : 'pause';
};
document.getElementById('full').onclick = async () => {
  if (!WID) return;
  await fetch('/api/worlds/' + WID + '/repo/refresh' + (TOKEN ? '?t=' + TOKEN : ''), {method: 'POST'})
    .catch(() => {});
  delete etags['/api/worlds/' + WID];
  refresh(true);
};
document.getElementById('theme').onclick = () => {
  const now = document.documentElement.getAttribute('data-theme');
  const next = now === 'auto' ? 'light' : now === 'light' ? 'dark' : 'auto';
  document.documentElement.setAttribute('data-theme', next);
  try { localStorage.setItem('rw-theme', next); } catch (_) {}
};
try { const t = localStorage.getItem('rw-theme'); if (t) document.documentElement.setAttribute('data-theme', t); } catch (_) {}

(async () => {
  try {
    const response = await api('/api/graph');
    if (!response.ok) throw new Error('graph.json returned HTTP ' + response.status);
    GRAPH = await response.json();
  } catch (err) {
    document.getElementById('cards').appendChild(el('p', {class: 'err'},
      'Could not load the organization graph (' + err.message + '), so no world ' +
      'can be shown. If this is a published page, graph.json must sit beside it.'));
    return;
  }
  await loadWorlds();
  if (WID) selectWorld(WID);
  if (STATIC) {
    // Published data changes only when the publisher pushes, and GitHub's raw
    // CDN holds it for minutes, so polling faster would only add requests.
    document.getElementById('full').hidden = true;
    document.getElementById('pause').hidden = true;
    setInterval(loadWorlds, LIVE_INTERVAL_MS);
    timer = setInterval(() => { etags['/api/worlds/' + WID] = null; refresh(true); }, LIVE_INTERVAL_MS);
  } else {
    setInterval(loadWorlds, 15000);
    timer = setInterval(() => refresh(false), 5000);
  }
})();
</script>
